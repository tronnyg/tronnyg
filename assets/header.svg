<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-labelledby="t">
  <title id="t">Yugen Naidoo</title>
  <style>
    .name { font: 700 52px Georgia,'Iowan Old Style','Palatino Linotype',Palatino,serif; fill: #f4d095; text-anchor: middle; letter-spacing: 1px;
            opacity: 0; animation: in 1.2s ease-out .2s forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .line { stroke: #b7664b; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 120; stroke-dashoffset: 120;
            animation: draw 1s ease-out 1.1s forwards, glow 4s ease-in-out 2.2s infinite alternate; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes glow { from { stroke: #b7664b; } to { stroke: #d9a67e; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .name { opacity: 1; } .line { stroke-dashoffset: 0; } }
  </style>
  <rect width="900" height="150" rx="14" fill="#14111a"/>
  <text class="name" x="450" y="88">Yugen Naidoo</text>
  <line class="line" x1="390" y1="110" x2="510" y2="110"/>
</svg>
